        depends_on:
            mongo:
                condition: service_healthy
            redis:
                condition: service_started
        ports:
            - 8888:80
        expose:
            - 80
        links:
            - mongo
            - redis
        stop_grace_period: 60s
        volumes:
            - ${DOCKER_VOLUME_STORAGE:-/mnt/docker-volumes}/sharelatex/data:/var/lib/overleaf
