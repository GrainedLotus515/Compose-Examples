    volumes:
      - ${DOCKER_VOLUME_STORAGE:-/mnt/docker-volumes}/nitter/data:/data
    restart: unless-stopped
    healthcheck:
      test: redis-cli ping
      interval: 30s
      timeout: 5s
      retries: 2
